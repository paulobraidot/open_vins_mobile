name: Android CI & OpenVINS Setup

on:
  push:
    branches: [ "restructure" ]
  pull_request:
    branches: [ "restructure" ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Enable KVM permissions
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-permissions.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug -x :app:syncDeviceFiles

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: open_vins_mobile-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Run Android Emulator and Push Calibration
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86
        profile: Nexus 5
        disable-animations: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        script: |
          # 1. Crear la estructura de carpetas privada directamente en el almacenamiento interno
          adb shell mkdir -p /sdcard/Android/data/com.openvins.android/files/config

          # 2. Transferir los archivos YAML de configuración desde el repositorio
          if [ -d "app_device/config" ]; then
            adb push app_device/config/. /sdcard/Android/data/com.openvins.android/files/config/
          else
            echo "Error: No se encontró la carpeta app_device/config."
            exit 1
          fi

          # 3. Listar archivos para verificar que se copiaron correctamente
          adb shell ls -la /sdcard/Android/data/com.openvins.android/files/config/

          # 4. Ejecutar tests instrumentados ignorando la sincronización previa de Gradle
          ./gradlew connectedCheck -x :app:syncDeviceFiles
