name: Android CI & OpenVINS Setup

on:
  push:
    branches: [ "restructure" ]
  pull_request:
    branches: [ "restructure" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug -x :app:syncDeviceFiles

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: open_vins_mobile-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Run Android Emulator and Push Calibration
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        target: google_apis
        arch: x86_64
        profile: pixel
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: |
          PACKAGE_NAME="com.openvins.android"
          TARGET_DIR="/sdcard/Android/data/${PACKAGE_NAME}/files/config"

          # 1. Crear directorio destino en el emulador iniciado
          adb shell "mkdir -p ${TARGET_DIR}"

          # 2. Copiar archivos desde app_device/config al emulador vía ADB
          if [ -d "app_device/config" ]; then
            adb push app_device/config/. "${TARGET_DIR}/"
          else
            echo "Error: No se encontró la carpeta app_device/config."
            exit 1
          fi

          # 3. Verificar transferencia de archivos
          adb shell "ls -la ${TARGET_DIR}"

          # 4. Ejecutar tests instrumentados ignorando syncDeviceFiles
          ./gradlew connectedCheck -x :app:syncDeviceFiles
