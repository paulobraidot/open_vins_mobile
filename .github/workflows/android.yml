name: Build OpenVINS Mobile APK

on:
  push:
    branches: [ "restructure" ]
  pull_request:
    branches: [ "restructure" ]

jobs:
  build:
    name: Compilar APK (Kotlin + C++ NDK)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout de la rama 'restructure' y Submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Dar permisos de ejecución a Gradle
        run: chmod +x ./gradlew

      - name: 4. Compilar APK (Debug) deshabilitando tareas de ADB
        run: ./gradlew assembleDebug -x syncDeviceFiles -x installDebug

      - name: 5. Subir APK para descargar e instalar en el M99
        uses: actions/upload-artifact@v4
        with:
          name: open_vins_mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
